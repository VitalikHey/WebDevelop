<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Поддержка — ConvCurrency</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">ConvCurrency</div>
      <div class="nav">
        <a href="index.html">Конвертер</a>
        <a href="page.html">О сервисе</a>
      </div>
      <div class="header-actions">
        <a href="auth.html" class="btn btn-ghost">Войти</a>
        <a href="auth.html" class="btn btn-primary">Регистрация</a>
      </div>
    </div>

    <div class="container">
      <h1 class="page-title">Служба поддержки</h1>
      <p class="page-subtitle">
        Опишите вашу проблему — мы ответим в течение 15 минут
      </p>

      <div class="support-layout">
        <div class="panel">
          <div class="panel-title">Форма обращения</div>
          <form class="support-form">
            <div class="form-row">
              <div class="form-group half">
                <label for="fio">ФИО</label>
                <input
                  type="text"
                  id="fio"
                  placeholder=""
                />
              </div>
              <div class="form-group half">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="" />
              </div>
            </div>
            <div class="form-group">
              <label for="subject">Тема обращения</label>
              <select id="subject">
                <option value="">Выберите тему</option>
                <option>Проблема с обменом</option>
                <option>Вопрос по курсу</option>
                <option>Техническая ошибка</option>
                <option>Предложение</option>
                <option>Другое</option>
              </select>
            </div>
            <div class="form-group">
              <label for="message">Сообщение</label>
              <textarea
                id="message"
                rows="6"
                placeholder="Опишите вашу проблему"
              ></textarea>
            </div>
            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" />
                Я согласен на обработку персональных данных
              </label>
            </div>
            <button
              type="button"
              class="btn btn-primary"
              style="width: 100%; padding: 14px"
            >
              Отправить сообщение
            </button>
          </form>
        </div>

        <div>
          <div class="sidebar-card">
            <h4>Контакты</h4>
            <div class="contact-row">
              <span class="contact-label">Email</span>
              <span class="contact-value">helpmail@yandex.ru</span>
            </div>
            <div class="contact-row">
              <span class="contact-label">Телефон</span>
              <span class="contact-value">+7-888-888-88-88</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">© 2026 ConvCurrency. Все права защищены.</div>
  </body>
</html>
