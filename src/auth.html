<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Вход — ConvCurrency</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <div class="header">
        <div class="logo">ConvCurrency</div>
        <div class="nav">
          <a href="index.html">Конвертер</a>
          <a href="page.html">О сервисе</a>
        </div>
        <div class="header-actions">
          <a href="auth.html" class="btn btn-ghost">Войти</a>
          <a href="auth.html" class="btn btn-primary">Регистрация</a>
        </div>
      </div>

      <div class="auth-wrapper">
        <div class="auth-card">
          <input
            type="radio"
            class="d-none"
            name="auth"
            id="auth-login"
            checked
          />
          <input type="radio" class="d-none" name="auth" id="auth-register" />

          <div class="auth-tabs">
            <label for="auth-login">Вход</label>
            <label for="auth-register">Регистрация</label>
          </div>

          <div class="auth-forms">
            <form class="auth-form form-login">
              <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="you@example.com" />
              </div>
              <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="••••••••" />
              </div>
              <button
                type="button"
                class="btn btn-primary"
                style="width: 100%; padding: 14px"
              >
                Войти
              </button>
            </form>

            <form class="auth-form form-register">
              <div class="form-group">
                <label>Имя</label>
                <input type="text" placeholder="Иван" />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="you@example.com" />
              </div>
              <div class="form-group">
                <label>Телефон</label>
                <input type="tel" placeholder="+7 (___) ___-__-__" />
              </div>
              <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="Минимум 8 символов" />
              </div>
              <button
                type="button"
                class="btn btn-primary"
                style="width: 100%; padding: 14px"
              >
                Создать аккаунт
              </button>
              <div class="form-footer">
                Нажимая кнопку, вы соглашаетесь с
                <a href="#">условиями использования</a>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="footer">© 2026 ConvCurrency. Все права защищены.</div>
  </body>
</html>
